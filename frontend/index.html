<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CryptoRank ICO Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">CryptoRank ICO Agent</p>
          <h1 data-i18n="title">ICO Dashboard</h1>
        </div>
        <div class="topActions">
          <label class="languageControl">
            <span data-i18n="language">Language</span>
            <select id="languageSelect">
              <option value="en">English</option>
              <option value="ru">Русский</option>
            </select>
          </label>
          <div class="summary" aria-label="Dataset summary">
            <div>
              <span id="totalCount">0</span>
              <small data-i18n="total">Total</small>
            </div>
            <div>
              <span id="pastCount">0</span>
              <small data-i18n="past">Past</small>
            </div>
            <div>
              <span id="upcomingCount">0</span>
              <small data-i18n="upcoming">Upcoming</small>
            </div>
          </div>
        </div>
      </header>

      <section class="controls" aria-label="Table filters">
        <label>
          <span data-i18n="search">Search</span>
          <input id="searchInput" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="Name or symbol" />
        </label>

        <label>
          <span data-i18n="status">Status</span>
          <select id="statusFilter">
            <option value="all" data-i18n="all">All</option>
            <option value="upcoming" data-i18n="upcoming">Upcoming</option>
            <option value="past" data-i18n="past">Past</option>
          </select>
        </label>

        <label>
          <span data-i18n="category">Category</span>
          <select id="categoryFilter">
            <option value="all" data-i18n="allCategories">All categories</option>
          </select>
        </label>

        <label>
          <span data-i18n="minRating">Min rating</span>
          <select id="ratingFilter">
            <option value="0" data-i18n="any">Any</option>
            <option value="80">80+</option>
            <option value="60">60+</option>
            <option value="40">40+</option>
          </select>
        </label>

        <label>
          <span data-i18n="sort">Sort</span>
          <select id="sortSelect">
            <option value="rating_desc" data-i18n="sortRating">Rating high to low</option>
            <option value="roi_desc" data-i18n="sortRoi">ROI high to low</option>
            <option value="ath_roi_desc" data-i18n="sortAthRoi">ATH ROI high to low</option>
            <option value="raised_desc" data-i18n="sortRaised">Raised high to low</option>
            <option value="date_desc" data-i18n="sortDate">Date newest</option>
            <option value="name_asc" data-i18n="sortName">Name A-Z</option>
          </select>
        </label>
      </section>

      <section class="insights" aria-label="Historical benchmark">
        <div class="insightCard">
          <span data-i18n="ath10x">ATH 10x+</span>
          <strong id="ath10xCount">0</strong>
        </div>
        <div class="insightCard">
          <span data-i18n="ath50x">ATH 50x+</span>
          <strong id="ath50xCount">0</strong>
        </div>
        <div class="insightCard">
          <span data-i18n="ath100x">ATH 100x+</span>
          <strong id="ath100xCount">0</strong>
        </div>
        <div class="insightCard wide">
          <span data-i18n="top10xCategories">Top 10x+ categories</span>
          <strong id="topCategories">-</strong>
        </div>
        <div class="insightCard wide">
          <span data-i18n="top10xBackers">Top 10x+ backers</span>
          <strong id="topBackers">-</strong>
        </div>
      </section>

      <section class="picksPanel" aria-label="Top picks">
        <div class="panelHeader">
          <div>
            <span class="panelEyebrow" data-i18n="topPicksEyebrow">Analytical shortlist</span>
            <h2 data-i18n="topPicksTitle">Top projects to research</h2>
          </div>
          <span class="disclaimer" data-i18n="notFinancialAdvice">Not financial advice</span>
        </div>
        <div id="topPicks" class="picksGrid"></div>
      </section>

      <section class="tableShell">
        <div class="tableMeta">
          <strong id="visibleCount">0 rows</strong>
          <span id="loadState">Loading data...</span>
        </div>
        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th><button class="sortHeader" data-sort-column="rating" data-i18n="rating">Rating</button></th>
                <th><button class="sortHeader" data-sort-column="name" data-i18n="project">Project</button></th>
                <th><button class="sortHeader" data-sort-column="status" data-i18n="status">Status</button></th>
                <th><button class="sortHeader" data-sort-column="category" data-i18n="category">Category</button></th>
                <th><button class="sortHeader" data-sort-column="investors" data-i18n="investors">Investors</button></th>
                <th><button class="sortHeader" data-sort-column="launchpads" data-i18n="launchpads">Launchpads</button></th>
                <th><button class="sortHeader" data-sort-column="start_date" data-i18n="start">Start</button></th>
                <th><button class="sortHeader" data-sort-column="end_date" data-i18n="end">End</button></th>
                <th><button class="sortHeader" data-sort-column="raised_amount" data-i18n="raised">Raised</button></th>
                <th><button class="sortHeader" data-sort-column="token_price" data-i18n="tokenPrice">Token price</button></th>
                <th><button class="sortHeader" data-sort-column="current_price" data-i18n="currentPrice">Current price</button></th>
                <th><button class="sortHeader" data-sort-column="roi" data-i18n="roi">ROI</button></th>
                <th><button class="sortHeader" data-sort-column="ath_roi" data-i18n="athRoi">ATH ROI</button></th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
